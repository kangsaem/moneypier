name: sig-trace

# 한 종목 최근 V1 판정 풀어 보기(sig_trace.py) → results/sig_trace.txt (리포트와 무관)
on:
  workflow_dispatch:
    inputs:
      symbol:
        default: "XOM"
      days:
        default: "5"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 확인
        run: python sig_trace.py > /tmp/st.log 2>&1 || (tail -30 /tmp/st.log; true)
        env:
          SYMBOL: ${{ inputs.symbol }}
          DAYS: ${{ inputs.days }}
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 8); do
            git fetch -q origin ${{ github.ref_name }}
            git reset -q --hard origin/${{ github.ref_name }}
            mkdir -p results && cp /tmp/st.log results/sig_trace.log
            git add results/sig_trace.*
            git commit -q -m "V1 판정 풀어 보기 [skip ci]" || exit 0
            git push -q origin HEAD:${{ github.ref_name }} && exit 0
            sleep $((i * 5))
          done
          exit 1
