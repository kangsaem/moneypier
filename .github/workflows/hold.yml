name: hold-test

# 그냥 보유 vs 보유 + 추적 손절(hold_cmp.py) — rand20 결과와 같은 기간·종목, 시세만 다시 받음(신호 계산 없음). 리포트 재실행 없음
# jobs = [{"market":"kospi","seeds":"1-100","out":"hold20_kospi_a"}, ...] 로 나눠 동시에(2026-10-13)
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "작업 목록(JSON)"
        default: '[{"market":"kospi","seeds":"1-30","out":"hold_kospi"},{"market":"nasdaq","seeds":"1-30","out":"hold_nasdaq"}]'
      trail:
        description: "추적 손절 폭(0.25 = 최고가 대비 −25%)"
        default: "0.25"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(inputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 시험
        run: python hold_cmp.py
        env:
          HC_MARKET: ${{ matrix.market }}
          HC_SEEDS: ${{ matrix.seeds }}
          HC_TRAIL: ${{ inputs.trail }}
          HC_OUT: ${{ matrix.out }}
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          cp results/${{ matrix.out }}.* /tmp/
          for i in $(seq 1 25); do
            git fetch -q origin ${{ github.ref_name }}
            git reset -q --hard origin/${{ github.ref_name }}
            cp /tmp/${{ matrix.out }}.* results/
            git add results/${{ matrix.out }}.*
            git commit -q -m "보유 vs 손절 시험 (${{ matrix.out }})" || exit 0
            git push -q origin HEAD:${{ github.ref_name }} && exit 0
            sleep $(( (RANDOM % 20) + i * 3 ))
          done
          exit 1
