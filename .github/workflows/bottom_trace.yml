name: bottom-trace

# 종목 하나의 바닥·꼭지 단계(1/3·2/3·3/3)가 실제 저점·고점에서 언제 켜졌는지 추적 (1~3분)
# 결과는 results/bottom_<코드>_<실행시각>.html로 쌓이고(최신본은 bottom_<코드>.html), 커밋되고, daily-report를 다시 돌려 페이지에 올린다.
on:
  workflow_dispatch:
    inputs:
      code:
        description: "종목 코드 (예: 417200, AAPL)"
        default: "417200"
      name:
        description: "종목 이름 (표시용, 비워도 됨)"
        default: "LS머트리얼즈"
      days:
        description: "추적 기간(거래일, 500 ≈ 2년)"
        default: "500"
      memo:
        description: "이번에 바꾼 로직 메모 (기록 목록에 표시)"
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 추적
        run: BT_VERSION=$(TZ=Asia/Seoul date +%Y%m%d-%H%M) python bottom_trace.py
        env:
          BT_MEMO: ${{ inputs.memo }}
          BT_CODE: ${{ inputs.code }}
          BT_NAME: ${{ inputs.name }}
          BT_DAYS: ${{ inputs.days }}
          BT_OUT_DIR: results
      - run: python bt_index.py
      - name: 결과 커밋
        env:
          CODE: ${{ inputs.code }}
          MEMO: ${{ inputs.memo }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results/
          git commit -m "바닥·꼭지 추적 ($CODE) $MEMO" || exit 0
          git pull --rebase origin ${{ github.ref_name }}
          python bt_index.py && git add results/backtests.html && git commit -m "백테스트 목록 갱신" || true
          git push
      - name: 리포트 다시 배포
        run: gh workflow run daily.yml --ref ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
