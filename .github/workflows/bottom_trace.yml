name: bottom-trace

# 종목 하나의 바닥·꼭지 단계(1/3·2/3·3/3)가 실제 저점·고점에서 언제 켜졌는지 추적 (1~3분)
# 결과는 results/bottom_<코드>_<실행시각>.html로 쌓이고(최신본은 bottom_<코드>.html), 커밋되고, daily-report를 다시 돌려 페이지에 올린다.
on:
  workflow_dispatch:
    inputs:
      code:
        description: "종목 코드 (예: 417200, AAPL)"
        default: "417200"
      name:
        description: "종목 이름 (표시용, 비워도 됨)"
        default: "LS머트리얼즈"
      days:
        description: "추적 기간(거래일, 500 ≈ 2년)"
        default: "500"
      memo:
        description: "이번에 바꾼 로직 메모 (기록 목록에 표시)"
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 추적
        run: BT_VERSION=$(TZ=Asia/Seoul date +%Y%m%d-%H%M) python bottom_trace.py
        env:
          BT_MEMO: ${{ inputs.memo }}
          BT_CODE: ${{ inputs.code }}
          BT_NAME: ${{ inputs.name }}
          BT_DAYS: ${{ inputs.days }}
          BT_OUT_DIR: results
      - name: 결과 커밋
        env:
          CODE: ${{ inputs.code }}
          MEMO: ${{ inputs.memo }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          # 이번 실행이 만든 결과 파일만 따로 보관 → 최신 저장소 위에 다시 얹고 목록(backtests.html)은 그때 새로 만듦
          # (여러 실행이 동시에 끝나도 목록 파일 충돌이 나지 않게, 밀어넣기 실패 시 5번까지 다시 시도)
          mkdir -p /tmp/new
          git status --porcelain --untracked-files=all results/ | awk '{print $NF}' | grep -v 'backtests.html$' > /tmp/list || true
          [ -s /tmp/list ] || { echo "새 결과 없음"; exit 0; }
          cat /tmp/list
          tar cf /tmp/new/r.tar -T /tmp/list
          for i in 1 2 3 4 5; do
            git fetch -q origin ${{ github.ref_name }}
            git reset -q --hard origin/${{ github.ref_name }}
            tar xf /tmp/new/r.tar
            python bt_index.py || echo "목록 만들기 실패(bt_index.py 확인)"
            git add results/
            git commit -q -m "바닥·꼭지 추적 ($CODE) $MEMO" || exit 0
            git push -q origin HEAD:${{ github.ref_name }} && exit 0
            sleep $((i * 7))
          done
          exit 1
      - name: 리포트 다시 배포
        run: gh workflow run daily.yml --ref ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
