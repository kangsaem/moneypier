name: bottom-cmp

# 시장 바닥 지표 시험(bottom_cmp.py) → results/bottom_cmp.txt · foreign_kospi.json
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 확인
        run: python bottom_cmp.py > /tmp/bc.log 2>&1 || (tail -30 /tmp/bc.log; true)
        env:
          TICKERS_JSON: ${{ secrets.TICKERS_JSON }}
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/bc && cp results/bottom_cmp.txt results/foreign_kospi.json /tmp/bc/ 2>/dev/null; cp /tmp/bc.log /tmp/bc/bottom_cmp.log
          for i in $(seq 1 8); do
            git fetch -q origin ${{ github.ref_name }}
            git reset -q --hard origin/${{ github.ref_name }}
            mkdir -p results && cp /tmp/bc/* results/
            git add results/bottom_cmp.* results/foreign_kospi.json
            git commit -q -m "시장 바닥 지표 시험 [skip ci]" || exit 0
            git push -q origin HEAD:${{ github.ref_name }} && exit 0
            sleep $((i * 5))
          done
          exit 1
