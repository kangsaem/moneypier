name: crash200

# 200일선 붕괴 사례(코스피·S&P500·나스닥) — crash200.py → results/crash200_*.json · crash200.txt
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 계산
        run: |
          python crash200.py
          python crash200_stats.py   # 붕괴 통계(2026-10-20) → results/crash200_stats.json
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/kx && cp results/crash200* /tmp/kx/
          for i in $(seq 1 10); do
            git fetch -q origin ${{ github.ref_name }}
            git reset -q --hard origin/${{ github.ref_name }}
            cp /tmp/kx/* results/
            git add results/crash200*
            git commit -q -m "200일선 붕괴 사례 계산 [skip ci]" || exit 0
            git push -q origin HEAD:${{ github.ref_name }} && exit 0
            sleep $((i * 5))
          done
          exit 1
