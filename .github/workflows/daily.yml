name: daily-report

on:
  schedule:
    - cron: "31 6 * * 1-5"   # UTC 06:31 = 한국시간 평일 15:31 (한국장 마감 직후 — 시간외 종가 15:40~16:00에 맞춰 텔레그램 알림)
    - cron: "10 22 * * 1-5"  # UTC 22:10 = 한국시간 화~토 07:10 (미국장 마감 후, 서머타임 여부와 무관)
  push:
    paths: ["tickers.json"]   # 북마클릿으로 종목이 갱신되면 즉시 실행
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write    # 신호 기록(history/) 커밋
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build_page.py
        env:
          TICKERS_JSON: ${{ secrets.TICKERS_JSON }}        # (선택) 종목을 비공개로 쓰고 싶을 때
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}    # (선택) 텔레그램 알림
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: 신호 기록 저장 (history/ 커밋 — 실패해도 리포트는 배포)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add history/ 2>/dev/null || exit 0
          git commit -q -m "신호 기록 $(TZ=Asia/Seoul date +%F)" || exit 0
          for i in 1 2 3 4 5; do
            git pull -q --rebase --autostash origin ${{ github.ref_name }} && git push -q origin HEAD:${{ github.ref_name }} && exit 0
            sleep $((i * 5))
          done
          exit 1
      - run: python backtest.py            # 최근 12개월 시그널 백테스트 → docs/backtest.html (약 6~10분)
        continue-on-error: true            # 실패해도 리포트는 그대로 배포
        timeout-minutes: 30
        env:
          TICKERS_JSON: ${{ secrets.TICKERS_JSON }}
      - name: 넓은 백테스트 결과 포함 (backtest-wide가 만든 results/ 를 페이지에 복사)
        run: if [ -d results ]; then cp -r results/. docs/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
