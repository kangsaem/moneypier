name: probe-ix

# 코스피 PBR 저점 매수 시험(pbr_test.py) → results/pbr_test.txt · pbr_kospi.json
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pykrx
      - name: 계산
        run: python probe_ix.py > results/ix_probe.log 2>&1 || (tail -50 results/ix_probe.log; true)
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/kx && cp -r results/ix* /tmp/kx/
          for i in $(seq 1 10); do
            git fetch -q origin ${{ github.ref_name }}
            git reset -q --hard origin/${{ github.ref_name }}
            cp -r /tmp/kx/* results/
            git add results/ix*
            git commit -q -m "indexergo 확인 [skip ci]" || exit 0
            git push -q origin HEAD:${{ github.ref_name }} && exit 0
            sleep $((i * 5))
          done
          exit 1
