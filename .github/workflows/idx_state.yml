name: idx-state-test

# 지수 상태 조건 시험(idx_state_bt.py) — V1 규칙·리포트·실전 기록과 무관한 별도 시험. 결과는 results/idx_state_<대상>*.html 로만 커밋하고
# 리포트를 다시 돌리지 않음(장중에 돌려도 신호 기록에 영향 없음). 세 대상을 동시에 실행(대략 30~90분).
on:
  workflow_dispatch:
    inputs:
      memo:
        description: "메모"
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        universe: [kospi, nasdaq, tickers]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 시험
        run: IS_VERSION=$(TZ=Asia/Seoul date +%Y%m%d-%H%M) python idx_state_bt.py
        env:
          IS_UNIVERSE: ${{ matrix.universe }}
          IS_MEMO: ${{ inputs.memo }}
          TICKERS_JSON: ${{ secrets.TICKERS_JSON }}
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/new
          git status --porcelain --untracked-files=all results/ | awk '{print $NF}' | grep idx_state > /tmp/list || true
          [ -s /tmp/list ] || { echo "새 결과 없음"; exit 0; }
          tar cf /tmp/new/r.tar -T /tmp/list
          for i in 1 2 3 4 5 6; do
            git fetch -q origin ${{ github.ref_name }}
            git reset -q --hard origin/${{ github.ref_name }}
            tar xf /tmp/new/r.tar
            git add results/
            git commit -q -m "지수 상태 시험 (${{ matrix.universe }}) ${{ inputs.memo }}" || exit 0
            git push -q origin HEAD:${{ github.ref_name }} && exit 0
            sleep $((i * 9))
          done
          exit 1
