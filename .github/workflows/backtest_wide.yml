name: backtest-wide

# 넓은 백테스트: 코스피 시가총액 상위 / 나스닥 대형주 / 내 종목 · 기간 지정 (필요할 때만 수동 실행)
# 결과는 실행 시각 버전을 붙여 results/에 쌓이고(최신본은 원래 이름으로도 복사), backtests.html 목록에서 지난 실행과 비교.
on:
  workflow_dispatch:
    inputs:
      market:
        description: "대상"
        type: choice
        options: [kospi, nasdaq, mine]
        default: kospi
      top:
        description: "상위 몇 개 (나스닥은 최대 50, 내 종목이면 무시)"
        default: "50"
      days:
        description: "기간(거래일, 1260 ≈ 5년, 252 ≈ 1년)"
        default: "1260"
      memo:
        description: "이번에 바꾼 로직 메모 (기록 목록에 표시)"
        default: ""

permissions:
  contents: write    # 결과 파일 커밋
  actions: write     # 끝난 뒤 daily-report 다시 실행

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 백테스트
        run: |
          case "${{ inputs.market }}" in
            nasdaq) export BT_UNIVERSE=nasdaq BT_OUT=results/backtest_nasdaq ;;
            mine)   export BT_UNIVERSE=tickers BT_OUT=results/backtest_mine ;;
            *)      export BT_UNIVERSE=kospi BT_OUT=results/backtest_wide ;;
          esac
          export BT_VERSION=$(TZ=Asia/Seoul date +%Y%m%d-%H%M)
          python backtest.py
        env:
          BT_TOP: ${{ inputs.top }}
          BT_DAYS: ${{ inputs.days }}
          BT_MEMO: ${{ inputs.memo }}
          TICKERS_JSON: ${{ secrets.TICKERS_JSON }}
      - name: 결과 커밋
        env:
          MARKET: ${{ inputs.market }}
          MEMO: ${{ inputs.memo }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          # 이번 실행이 만든 결과 파일만 따로 보관 → 최신 저장소 위에 다시 얹고 목록(backtests.html)은 그때 새로 만듦
          # (여러 실행이 동시에 끝나도 목록 파일 충돌이 나지 않게, 밀어넣기 실패 시 5번까지 다시 시도)
          mkdir -p /tmp/new
          git status --porcelain --untracked-files=all results/ | awk '{print $NF}' | grep -v 'backtests.html$' > /tmp/list || true
          [ -s /tmp/list ] || { echo "새 결과 없음"; exit 0; }
          cat /tmp/list
          tar cf /tmp/new/r.tar -T /tmp/list
          for i in 1 2 3 4 5; do
            git fetch -q origin ${{ github.ref_name }}
            git reset -q --hard origin/${{ github.ref_name }}
            tar xf /tmp/new/r.tar
            python bt_index.py || echo "목록 만들기 실패(bt_index.py 확인)"
            git add results/
            git commit -q -m "백테스트 결과 ($MARKET) $MEMO" || exit 0
            git push -q origin HEAD:${{ github.ref_name }} && exit 0
            sleep $((i * 7))
          done
          exit 1
      - name: 리포트 다시 배포
        run: gh workflow run daily.yml --ref ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
