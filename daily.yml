name: daily-report

on:
  schedule:
    - cron: "30 7 * * 1-5"   # UTC 07:30 = 한국시간 평일 16:30
  push:
    paths: ["tickers.json"]   # 북마클릿으로 종목이 갱신되면 즉시 실행
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build_page.py
        env:
          TICKERS_JSON: ${{ secrets.TICKERS_JSON }}        # (선택) 종목을 비공개로 쓰고 싶을 때
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}    # (선택) 텔레그램 알림
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
